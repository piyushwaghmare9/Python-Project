<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCCOE Prep | Complete PYQ Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --card-bg: #ffffff;
      --sidebar-bg: #ffffff;
      --option-bg: #f8fafc;
      --chip-bg: #f1f5f9;
    }
    body.navy-theme {
      --bg-primary: #0a0e27;
      --bg-secondary: #111837;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --border-color: #1e293b;
      --card-bg: #111837;
      --sidebar-bg: #0d1430;
      --option-bg: #0f172a;
      --chip-bg: #1e293b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: all 0.3s; }
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95); }
    .login-card { background: white; border-radius: 32px; padding: 48px 40px; width: 100%; max-width: 440px; text-align: center; }
    body.navy-theme .login-card { background: #111837; }
    .login-card h1 { font-size: 36px; background: linear-gradient(135deg, #1e1b4b, #4c1d95); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .btn { padding: 14px 28px; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #1e1b4b, #4c1d95); color: white; width: 100%; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 16px; background: white; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; background: var(--sidebar-bg); padding: 28px 20px; position: fixed; height: 100vh; border-right: 1px solid var(--border-color); }
    .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #1e1b4b, #4c1d95); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 32px; }
    .nav-item { display: flex; align-items: center; padding: 12px 16px; margin: 4px 0; border-radius: 14px; color: var(--text-secondary); cursor: pointer; }
    .nav-item:hover { background: var(--option-bg); color: #4c1d95; }
    .theme-toggle { margin-top: auto; padding: 16px 12px; border-top: 1px solid var(--border-color); cursor: pointer; display: flex; gap: 12px; }
    .main-content { flex: 1; margin-left: 280px; padding: 28px 36px; }
    .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .subject-card { background: var(--card-bg); border-radius: 20px; padding: 24px; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s; }
    .subject-card:hover { transform: translateY(-4px); border-color: #4c1d95; }
    .subject-icon { font-size: 44px; margin-bottom: 16px; }
    .chapters-grid { display: flex; flex-direction: column; gap: 12px; }
    .chapter-row { background: var(--card-bg); border-radius: 18px; padding: 18px 24px; cursor: pointer; border: 1px solid var(--border-color); display: flex; justify-content: space-between; }
    .chapter-row:hover { transform: translateX(6px); border-color: #4c1d95; }
    .question-container { max-width: 900px; margin: 0 auto; }
    .question-card { background: var(--card-bg); border-radius: 24px; padding: 32px; border: 1px solid var(--border-color); }
    .options { display: flex; flex-direction: column; gap: 14px; margin: 20px 0; }
    .option { padding: 16px 20px; background: var(--option-bg); border-radius: 16px; cursor: pointer; border: 1.5px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
    .option.correct-highlight { background: #10b981; color: white; }
    .option.wrong-highlight { background: #ef4444; color: white; }
    .action-buttons { display: flex; gap: 16px; margin: 20px 0; }
    .btn-check { background: #7dd3fc; color: #0c4a6e; width: auto; }
    .btn-bookmark { background: #fef3c7; color: #b45309; width: auto; }
    .dots-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
    .q-dot { width: 42px; height: 42px; border-radius: 50%; cursor: pointer; background: var(--chip-bg); border: none; }
    .q-dot.current { background: linear-gradient(135deg, #1e1b4b, #4c1d95); color: white; }
    .q-dot.checked-correct { background: #10b981; color: white; }
    .q-dot.checked-wrong { background: #ef4444; color: white; }
    .feedback-message { padding: 12px 20px; border-radius: 12px; margin: 16px 0; display: none; }
    .feedback-correct { background: #d1fae5; color: #065f46; display: block; }
    .feedback-wrong { background: #fee2e2; color: #991b1b; display: block; }
    .loading { text-align: center; padding: 60px; font-size: 18px; }
    .page { display: none; }
    .page.active-page { display: block; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>

<div id="loginPage" class="page active-page">
  <div class="login-container">
    <div class="login-card">
      <h1>📚 PCCOE Prep</h1>
      <form id="loginForm">
        <div class="input-group"><label>Username</label><input type="text" id="loginUsername" required></div>
        <div class="input-group"><label>Password</label><input type="password" required></div>
        <button type="submit" class="btn btn-primary">Start Learning →</button>
      </form>
    </div>
  </div>
</div>

<div id="appWrapper" style="display: none;">
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">📖 PCCOE Prep</div>
      <nav>
        <div class="nav-item" data-view="subjects"><span style="margin-right:12px">📚</span> Subjects</div>
        <div class="nav-item" data-view="bookmarks"><span style="margin-right:12px">🔖</span> Bookmarks</div>
      </nav>
      <div class="theme-toggle" id="themeToggle"><span>🌙</span><span>Dark Mode</span></div>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border-color)">
        <div id="sidebarUserName">Student</div>
      </div>
    </aside>
    <main class="main-content" id="mainContent"></main>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000';
  
  const subjects = [
    { id: "linear_algebra", name: "Linear Algebra & Univariate Calculus", icon: "📐", chapters: ["Unit 1: Matrices & Linear Algebra", "Unit 2: Differential Calculus", "Unit 3: Ordinary Differential Equations", "Unit 4: Linear Differential Equations"] },
    { id: "chemistry", name: "Engineering Chemistry", icon: "🧪", chapters: ["Unit 1: Water Technology", "Unit 2: Fuels and Combustion", "Unit 3: Corrosion and Corrosion Control", "Unit 4: Polymers and Nanomaterials"] },
    { id: "digital_electronics", name: "Digital Electronics & Computer Organization", icon: "💻", chapters: ["Unit 1: Logic Gates & Minimization", "Unit 2: Combinational Logic", "Unit 3: Sequential Logic", "Unit 4: Registers and Counters", "Unit 5: Computer Organization"] },
    { id: "programming", name: "Computer Programming & Problem Solving", icon: "⌨️", chapters: ["Unit 1: Problem Solving", "Unit 2: Complex Problem Solving", "Unit 3: Arrays", "Unit 4: Searching & Sorting", "Unit 5: Data Structures"] }
  ];

  let currentSubject = null, currentChapter = null, currentQuestions = [], currentIdx = 0;
  let userAnswers = {}, answerChecked = {}, answerResult = {};
  let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
  
  function saveBookmarks() { localStorage.setItem('bookmarks', JSON.stringify(bookmarks)); }
  function isBookmarked(subId, chap, qIdx) { return bookmarks.some(b => b.subjectId === subId && b.chapter === chap && b.qIdx === qIdx); }
  function addBookmark(subId, subName, chap, qIdx, qText) { if(!isBookmarked(subId, chap, qIdx)) { bookmarks.push({ subjectId: subId, subjectName: subName, chapter: chap, qIdx, qText }); saveBookmarks(); } }
  function removeBookmark(subId, chap, qIdx) { bookmarks = bookmarks.filter(b => !(b.subjectId === subId && b.chapter === chap && b.qIdx === qIdx)); saveBookmarks(); }

  async function fetchQuestions(subjectId, chapter) {
    const res = await fetch(`${API_BASE}/api/questions?subjectId=${subjectId}&chapter=${encodeURIComponent(chapter)}`);
    if (!res.ok) throw new Error('Failed to fetch');
    return await res.json();
  }

  const main = document.getElementById('mainContent');

  function renderSubjects() {
    let html = `<h1>📚 All Subjects</h1><div class="subjects-grid">`;
    subjects.forEach(sub => {
      html += `<div class="subject-card" data-id="${sub.id}" data-name="${sub.name}" data-icon="${sub.icon}"><div class="subject-icon">${sub.icon}</div><h3>${sub.name}</h3><p>${sub.chapters.length} chapters</p></div>`;
    });
    html += `</div>`;
    main.innerHTML = html;
    document.querySelectorAll('.subject-card').forEach(card => {
      card.addEventListener('click', () => {
        currentSubject = { id: card.dataset.id, name: card.dataset.name, icon: card.dataset.icon, chapters: subjects.find(s => s.id === card.dataset.id).chapters };
        renderChapters();
      });
    });
  }

  function renderChapters() {
    let html = `<div style="margin-bottom:20px"><a onclick="renderSubjects()" style="color:#4c1d95;cursor:pointer">← All Subjects</a> › ${currentSubject.name}</div>
      <h1>${currentSubject.icon} ${currentSubject.name}</h1><div class="chapters-grid">`;
    currentSubject.chapters.forEach((ch, idx) => {
      html += `<div class="chapter-row" data-chapter="${ch}"><div><strong>${idx+1}. ${ch}</strong></div><div>📚 Click to start →</div></div>`;
    });
    html += `</div>`;
    main.innerHTML = html;
    document.querySelectorAll('.chapter-row').forEach(row => {
      row.addEventListener('click', async () => {
        currentChapter = row.dataset.chapter;
        main.innerHTML = `<div class="loading">⏳ Loading questions from database...</div>`;
        try {
          currentQuestions = await fetchQuestions(currentSubject.id, currentChapter);
          if (currentQuestions.length === 0) throw new Error("No questions found");
          currentIdx = 0; userAnswers = {}; answerChecked = {}; answerResult = {};
          renderQuestion();
        } catch(err) { main.innerHTML = `<div class="loading">❌ Error: ${err.message}<br><button onclick="renderChapters()">Try Again</button></div>`; }
      });
    });
  }

  function renderQuestion() {
    const q = currentQuestions[currentIdx];
    const total = currentQuestions.length;
    const selected = userAnswers[currentIdx];
    const checked = answerChecked[currentIdx];
    const isCorrect = answerResult[currentIdx];
    const bookmarked = isBookmarked(currentSubject.id, currentChapter, currentIdx);
    
    let html = `<div><a onclick="renderChapters()" style="color:#4c1d95;cursor:pointer">← Back</a></div>
      <div class="question-container"><div class="question-card">
      <div style="margin-bottom:20px"><strong>Question ${currentIdx+1}/${total}</strong> | ${currentChapter}</div>
      <div class="question-text">${escapeHtml(q.text)}</div><div class="options">`;
    q.options.forEach((opt, idx) => {
      const letter = String.fromCharCode(65+idx);
      const isSelected = selected === idx;
      let addClass = (checked && isSelected) ? (isCorrect ? 'correct-highlight' : 'wrong-highlight') : '';
      html += `<div class="option ${addClass}" onclick="selectOption(${idx})"><input type="radio" ${isSelected ? 'checked' : ''}><span><strong>${letter}.</strong> ${escapeHtml(opt)}</span></div>`;
    });
    html += `</div><div class="action-buttons"><button class="btn btn-check" onclick="checkAnswer()">✅ Check</button>
      <button class="btn btn-bookmark" onclick="toggleBookmark()">${bookmarked ? '★ Bookmarked' : '☆ Bookmark'}</button></div>
      <div id="fbMsg" class="feedback-message"></div>
      <div class="question-nav"><button class="btn" style="background:var(--btn-secondary-bg);padding:10px 20px" onclick="prevQ()" ${currentIdx===0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 20px" onclick="nextQ()">Next →</button></div>
      <div class="dots-grid" id="dotsGrid"></div></div></div>`;
    main.innerHTML = html;
    
    const grid = document.getElementById('dotsGrid');
    if(grid) for(let i=0;i<total;i++){ let cls='q-dot'; if(i===currentIdx) cls+=' current'; else if(answerChecked[i]) cls+= answerResult[i] ? ' checked-correct' : ' checked-wrong'; grid.innerHTML += `<button class="${cls}" onclick="jumpToQ(${i})">${i+1}</button>`; }
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';}); }
  window.selectOption = function(idx){ userAnswers[currentIdx]=idx; answerChecked[currentIdx]=false; renderQuestion(); };
  window.checkAnswer = function(){ let s=userAnswers[currentIdx]; if(s===undefined){ alert("Select an option"); return; } let correct=(s===currentQuestions[currentIdx].correctIndex); answerChecked[currentIdx]=true; answerResult[currentIdx]=correct; let fb=document.getElementById('fbMsg'); fb.className=`feedback-message ${correct?'feedback-correct':'feedback-wrong'}`; fb.innerHTML=correct?'✅ Correct!':`❌ Incorrect. Correct: ${String.fromCharCode(65+currentQuestions[currentIdx].correctIndex)}`; renderQuestion(); };
  window.toggleBookmark = function(){ if(isBookmarked(currentSubject.id, currentChapter, currentIdx)) removeBookmark(currentSubject.id, currentChapter, currentIdx); else addBookmark(currentSubject.id, currentSubject.name, currentChapter, currentIdx, currentQuestions[currentIdx].text); renderQuestion(); };
  window.prevQ = function(){ if(currentIdx>0){ currentIdx--; renderQuestion(); } };
  window.nextQ = function(){ if(currentIdx<currentQuestions.length-1){ currentIdx++; renderQuestion(); } else { let c=0; for(let i=0;i<currentQuestions.length;i++) if(answerChecked[i] && answerResult[i]) c++; main.innerHTML=`<div style="text-align:center;padding:60px;background:var(--card-bg);border-radius:32px"><h2>🎉 Chapter Completed!</h2><div style="font-size:56px;color:#4c1d95;margin:20px">${c}/${currentQuestions.length}</div><button class="btn btn-primary" onclick="renderChapters()">Back to Chapters</button></div>`; } };
  window.jumpToQ = function(i){ currentIdx=i; renderQuestion(); };

  function renderBookmarks() {
    if(bookmarks.length===0){ main.innerHTML=`<div style="text-align:center;padding:60px">🔖 No bookmarks yet</div>`; return; }
    let html=`<h1>🔖 Your Bookmarks</h1>`;
    bookmarks.forEach(b=>{ html+=`<div style="background:var(--card-bg);border-radius:16px;padding:16px;margin:12px 0;cursor:pointer;border:1px solid var(--border-color)" onclick="navigateToBookmark('${b.subjectId}','${b.chapter}',${b.qIdx})"><strong>${b.subjectName}</strong> - ${b.chapter}<br><small>${escapeHtml(b.qText.substring(0,80))}...</small></div>`; });
    main.innerHTML=html;
  }
  
  window.navigateToBookmark = async function(subId, chap, qIdx){
    currentSubject = subjects.find(s=>s.id===subId);
    currentChapter = chap;
    main.innerHTML = `<div class="loading">Loading...</div>`;
    try {
      currentQuestions = await fetchQuestions(subId, chap);
      currentIdx = qIdx;
      userAnswers = {}; answerChecked = {}; answerResult = {};
      renderQuestion();
    } catch(err) { renderSubjects(); }
  };

  function initTheme() { if(localStorage.getItem('theme')==='navy') document.body.classList.add('navy-theme'); }
  function toggleTheme() { document.body.classList.toggle('navy-theme'); localStorage.setItem('theme', document.body.classList.contains('navy-theme') ? 'navy' : 'light'); }
  document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);
  document.getElementById('loginForm')?.addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('sidebarUserName').innerText = document.getElementById('loginUsername').value || "Student"; document.getElementById('loginPage').classList.remove('active-page'); document.getElementById('appWrapper').style.display = 'block'; renderSubjects(); });
  document.querySelectorAll('[data-view]').forEach(el => { el.addEventListener('click', () => { if(el.dataset.view === 'subjects') renderSubjects(); else renderBookmarks(); }); });
  initTheme();
</script>
</body>
</html>
